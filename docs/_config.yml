title: Azure SQL Database container
description: >-
  Azure SQL Database, running on your laptop. Build, test, and ship against the
  real engine. No Azure subscription, no shared instance, no connection-string
  rewrites from inner loop to production.
# Project Pages site is served from /docs on the default branch.
# baseurl is the production path; the local preview overrides it with --baseurl "".
baseurl: "/azure-sql-database-container"
url: "https://microsoft.github.io"
repo: "https://github.com/microsoft/azure-sql-database-container"
# Public repo the nav "GitHub repo" button opens. Update this to the public repo URL
# once it exists (the current repo is private and 404s for external users).
public_repo: "https://github.com/microsoft/azure-sql-database-container"
youtube_id: "S6PWxUAUspY"
demo_link: "https://aka.ms/azuresqldb-container-demo"

# Web analytics (client-side). Loads only when `enabled` is true and a provider is configured.
# The Application Insights connection string is browser-embeddable and is not a secret.
analytics:
  enabled: true
  app_insights_connection_string: "InstrumentationKey=c19fefc8-7c54-4c31-a081-6893153bb911;IngestionEndpoint=https://eastus-8.in.applicationinsights.azure.com/;LiveEndpoint=https://eastus.livediagnostics.monitor.azure.com/;ApplicationId=cd119e2c-6b36-43c2-8703-04d5bc1a86c7"
  clarity_id: ""   # set the Microsoft Clarity project id to enable Clarity (separate change)
  ga4_id: ""       # set the GA4 measurement id (G-XXXXXXX) to enable GA4 (separate change)


markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-relative-links
  - jekyll-sitemap
relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile.preview
  - vendor
  - _social-card
